<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Day 18 - Responsive Units</title>
    <style>
        /* CSS RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eccc68;
            
            /* DAY 18: 100vh ka matlab poori screen ki height */
            height: 100vh; 
            
            /* Box ko screen ke bilkul center mein lane ke liye */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsive Card Box */
        .responsive-box {
            background-color: white;
            
            /* DAY 18: Fixed px ki jagah 80vw use kiya (Mobile screen par fit aayega) */
            width: 80vw;
            max-width: 500px;
            
            /* DAY 18: Padding ke liye rem use kiya */
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #ff4757;
            /* DAY 18: Capital letter mein convert karna */
            text-transform: uppercase;
            /* Aksharon ke beech gap */
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        p {
            color: #2f3542;
            font-size: 1.1rem;
            /* DAY 18: Lines ke beech ka fasla set karna */
            line-height: 1.6;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="responsive-box">
        <h2>Day 18: CSS Units</h2>
        <p>Aaj humne seekha ke width ko fixed rakhne ke bajaye 'vw' aur 'vh' kaise use karte hain, aur text ko bariki se kaise style kiya jata hai. Is page ko mobile par kholein ya computer par, yeh khud ko screen ke hisab se adjust kar lega!</p>
    </div>

</body>
</html>
